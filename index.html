<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="build-version" content="__BUILD_VERSION__">
  <meta name="author" content="Niagova">
  <title>Pet Spa &amp; Hotel Template Showcase</title>
  <meta name="description" content="Compare three Pet Spa &amp; Hotel website concepts in one showcase: Modern, Playful and Premium.">
  <meta name="theme-color" content="#fffaf3">
  <meta property="og:title" content="Pet Spa &amp; Hotel Template Showcase">
  <meta property="og:image" content="01-modern/assets/generated/hero-mobile.webp">
  <link rel="canonical" href="https://demo-cathotel.niagova.com/">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="index.css?v=__BUILD_VERSION__">
</head>
<body>
  <a class="skip-link" href="#templatePreview">Skip to website preview</a>

  <header class="showcase-bar" aria-label="Template preview controls">
    <div class="showcase-identity">
      <a class="showcase-logo" href="https://niagova.com/" target="_blank" rel="noopener"><img src="assets/niagova-logo.svg" alt="Niagova" width="118" height="28"></a>
      <span class="showcase-title">
        <strong>Pet Spa &amp; Hotel concepts</strong>
        <small><span>Demo by Niagova</span> · <span id="previewStatus" aria-live="polite">Previewing Modern</span></small>
      </span>
    </div>

    <nav class="template-tabs" aria-label="Choose a website template">
      <button class="template-tab" type="button" data-template="modern" aria-pressed="true"><span>01</span> Modern</button>
      <button class="template-tab" type="button" data-template="playful" aria-pressed="false"><span>02</span> Playful</button>
      <button class="template-tab" type="button" data-template="premium" aria-pressed="false"><span>03</span> Premium</button>
    </nav>

    <div class="showcase-actions">
      <a class="open-template" id="openTemplate" href="01-modern/index.html" target="_blank" rel="noopener" aria-label="Open this template as a full page in a new tab">
        <span class="open-label">Open full page</span> <span aria-hidden="true">↗</span>
      </a>
      <a class="view-packages" href="https://niagova.com/#pricing" target="_blank" rel="noopener">View packages</a>
    </div>
  </header>

  <!-- A shareable ?for= link opens as a branded website proposal, not a template catalogue. -->
  <header class="prospect-bar" id="prospectBar" hidden aria-label="Your personalised website preview">
    <div class="prospect-identity">
      <span class="prospect-monogram" id="prospectMonogram" aria-hidden="true">🐾</span>
      <div class="prospect-intro">
        <strong id="prospectName">Your business</strong>
        <small>Website concept made just for you <span aria-hidden="true">·</span> <a href="https://niagova.com/" target="_blank" rel="noopener">by Niagova</a></small>
      </div>
    </div>
    <nav class="prospect-styles" aria-label="Explore your website styles">
      <button type="button" data-template="premium" aria-pressed="false">Elegant</button>
      <button type="button" data-template="modern" aria-pressed="false">Modern</button>
      <button type="button" data-template="playful" aria-pressed="false">Playful</button>
    </nav>
    <a class="prospect-cta" id="prospectContact" href="https://niagova.com/#pricing" target="_blank" rel="noopener">
      <span>Make it yours</span><span aria-hidden="true">↗</span>
    </a>
  </header>

  <main class="preview-shell">
    <iframe id="templatePreview" name="templatePreview" src="about:blank" title="Cat hotel website template preview"></iframe>
  </main>

  <noscript>
    <div class="no-script">
      JavaScript is needed for the template switcher. Open a template directly:
      <a href="01-modern/index.html">Modern</a>,
      <a href="02-playful/index.html">Playful</a> or
      <a href="03-premium/index.html">Premium</a>.
    </div>
  </noscript>

  <script src="index.js?v=__BUILD_VERSION__"></script>
</body>
</html>
